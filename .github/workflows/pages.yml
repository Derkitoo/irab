name: Validate static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-static-site
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check content-advanced.js
          node --check srs.js
          node srs.test.mjs

      - name: Check required static files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f content-advanced.js
          test -f srs.js
          grep -q 'content-advanced.js' app.js
