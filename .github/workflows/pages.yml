name: Validate static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-static-site
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check curriculum.js
          node --check content-core.js
          node --check content-advanced.js
          node --check content-helpers.js
          node --check explanations.js
          node --check search.js
          node --check diagnostic.js
          node --check badges.js
          node --check glossary.js
          node --check glossary-index.js
          node --check srs.js
          node --check sw.js
          node --check backup.js
          node --check merge.js
          node --check analytics.js
          node --check coach.js
          node --check cloud.js
          node --check day.js
          node --check mastery.js
          node --check question-topics.js
          node --check session.js
          node --check progress-schema.js
          node --check cloud-errors.js
          node --check sync.js
          node srs.test.mjs
          node backup.test.mjs
          node merge.test.mjs
          node analytics.test.mjs
          node coach.test.mjs
          node progress-schema.test.mjs
          node cloud-errors.test.mjs
          node sync.test.mjs
          node question-topics.test.mjs
          node session.test.mjs
          node day.test.mjs
          node curriculum.test.mjs
          node glossary.test.mjs
          node explanations.test.mjs
          node search.test.mjs
          node diagnostic.test.mjs
          node badges.test.mjs

      - name: Check required static files
        run: |
          test -f index.html
          grep -q 'live-region' index.html
          grep -q 'skip-link' index.html
          test -f styles.css
          test -f app.js
          test -f curriculum.js
          test -f content-core.js
          test -f content-advanced.js
          test -f content-helpers.js
          test -f explanations.js
          test -f search.js
          test -f diagnostic.js
          test -f badges.js
          test -f glossary.js
          test -f glossary-index.js
          test -f srs.js
          test -f sw.js
          test -f manifest.webmanifest
          test -f icon.svg
          test -f backup.js
          test -f merge.js
          test -f analytics.js
          test -f coach.js
          test -f cloud.js
          test -f day.js
          test -f mastery.js
          test -f question-topics.js
          test -f session.js
          test -f progress-schema.js
          test -f cloud-errors.js
          test -f sync.js
          test -f supabase-config.js
          test -f supabase/schema.sql
          grep -q 'curriculum.js' app.js
          grep -q 'content-advanced.js' curriculum.js
